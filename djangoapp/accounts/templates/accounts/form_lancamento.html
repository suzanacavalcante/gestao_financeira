{% extends 'base.html' %}

{% block title %}{{ titulo }} - PoupAí{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card-custom" style="width: 100%; max-width: 600px;">
        <h2 class="mb-4 text-center">
            <span style="color: #8a2be2;"><i class="bi bi-pencil-square"></i></span>
            {{ titulo }}
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="text-gray small mb-2">Descrição</label>
                {{ form.descricao }}
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="text-gray small mb-2">Valor (R$)</label>
                    {{ form.valor }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="text-gray small mb-2">Data</label>
                    {{ form.data }}
                </div>
            </div>

            <div class="mb-3">
                <label class="text-gray small mb-2">Categoria</label>
                {{ form.categoria }}
            </div>

            <div class="mb-4" id="container-pagamento" style="display: none;">
                <label class="small mb-2" style="color: #0dcaf0;">
                    <i class="bi bi-credit-card-2-back me-1"></i> Forma de Pagamento
                </label>
                {{ form.forma_pagamento }}
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-purple" style="background-color: #8a2be2; border: none; color: white; padding: 12px; font-weight: 600;">
                    Salvar Alterações
                </button>
                <a href="{% url 'lancamentos' %}" class="btn btn-outline-secondary" style="padding: 12px; border-radius: 8px;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const categoriaSelect = document.querySelector('select[name="categoria"]');
        const containerPagamento = document.getElementById('container-pagamento');

        function verificarPagamento() {
            // Se houver uma categoria selecionada, mostramos a forma de pagamento
            // A lógica de limpar se for Receita já está na sua View para segurança
            if (categoriaSelect.value) {
                containerPagamento.style.display = 'block';
            } else {
                containerPagamento.style.display = 'none';
            }
        }

        categoriaSelect.addEventListener('change', verificarPagamento);
        verificarPagamento(); // Executa ao carregar para casos de edição
    });
</script>

<style>
    /* Mantendo sua paleta original */
    .card-custom {
        background: #1e1e2f;
        padding: 30px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .text-gray { color: #b0b0b0; }

    input, select, textarea {
        width: 100%; 
        padding: 12px; 
        background: #131325 !important; 
        border: 1px solid #30304d !important;
        color: white !important; 
        border-radius: 8px !important;
        outline: none;
    }

    input:focus, select:focus {
        border-color: #8a2be2 !important;
        box-shadow: 0 0 0 0.2rem rgba(138, 43, 226, 0.25);
    }

    .btn-purple:hover {
        background-color: #7a1fd1 !important;
        filter: brightness(1.1);
    }
</style>
{% endblock %}
