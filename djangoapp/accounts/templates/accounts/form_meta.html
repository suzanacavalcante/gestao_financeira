{% extends 'base.html' %}

{% block title %}{{ titulo }} - PoupAí{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card-custom" style="width: 100%; max-width: 500px;">
        <h2 class="mb-4 text-center">
            <span style="color: #8a2be2;"><i class="bi bi-pencil-square"></i></span>
            {{ titulo }}
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="text-gray small mb-2">Nome da Meta</label>
                {{ form.nome }}
            </div>
            
            <div class="mb-3">
                <label class="text-gray small mb-2">Valor Alvo (R$)</label>
                {{ form.valor_alvo }}
            </div>

            <div class="mb-3">
                <label class="text-gray small mb-2">Valor Poupado Atual (R$)</label>
                {{ form.valor_poupado }}
            </div>

            <div class="mb-3">
                <label class="text-gray small mb-2">Data Limite</label>
                {{ form.data_limite }}
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-purple" style="background-color: #8a2be2; border: none; color: white; padding: 12px; font-weight: 600;">
                    Salvar Alterações
                </button>
                <a href="{% url 'metas' %}" class="btn btn-outline-secondary" style="padding: 12px;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    input {
        width: 100%; 
        padding: 12px; 
        background: #131325; 
        border: 1px solid #30304d;
        color: white; 
        border-radius: 8px;
    }
</style>
{% endblock %}
