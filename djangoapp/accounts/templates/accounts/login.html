<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PoupAí</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #0f0f12;
        --card-dark: #1a1a2e;
        --purple-primary: #8a2be2;
        --purple-hover: #a04ef6;
        --text-gray: #b0b0b0;
      }

      body {
        background-color: var(--bg-dark);
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Tahoma, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      
      .login-card {
        background-color: var(--card-dark);
        border: 1px solid rgba(138, 43, 226, 0.2);
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      h2 {
        font-weight: 700;
        color: white;
        letter-spacing: -1px;
      }

      .purple-text {
        color: var(--purple-primary);
      }

      /* Estilização dos campos do Django*/
      p {
        margin-bottom: 1.2rem;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        color: var(--text-gray);
      }

      input {
        width: 100%;
        padding: 12px;
        background-color: #131325 !important;
        border: 1px solid #30304d;
        border-radius: 8px !important;
        color: white !important;
        transition: 0.3s;
      }

      input:focus {
        border-color: var(--purple-primary) !important;
        box-shadow: 0 0 0 0 0.25rem rgba(138, 43, 226, 0.25) !important;
        outline: none;
      }

      .btn-purple {
        background-color: var(--purple-primary);
        border: none;
        padding: 12px;
        font-weight: 600;
        border-radius: 8px;
        color: white;
        transition: 0.3s;
        margin-top: 0.5rem;
      }

      .btn-purple:hover {
        background-color: var(--purple-hover);
        transform: translateY(-2px);
        color: white;
      }

      .footer-link {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: var(--text-gray);
      }

      .footer-link a {
        color: var(--purple-primary);
        text-decoration: none;
      }
    </style>
    <body>
      <div class="login-card">
        <h2 class="text-center">Poup<span class="purple-text">Aí</span></h2>
        <p class="text-center text-secondary mb-4">Bem-vindo de volta!</p>

        <form method="POST">
          {% csrf_token %}
            
            {% if form.errors %}
                <div class="alert alert-danger bg-danger bg-opacity-10 border-0 text-danger p-2" style="font-size: 0.85rem;">
                    Usuário ou senha incorretos.
                </div>
            {% endif %}

            {{ form.as_p }}
            <button type="submit" class="btn btn-purple w-100">Entrar</button>
        </form>

        <div class="footer-link">
          Novo por aqui?<a href="{% url 'cadastro' %}">Crie uma conta</a>
        </div>
      </div>
    </body>
  </head>
</html>
