<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=devide-width, initial-scale=1.0">
        <title>{% block title%} PoupAí {% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-dark: #0f0f12;
            --sidebar-color: #1a1a2e;
            --purple-primary: #8a2be2;
            --purple-hover: #a04ef6;
            --text-gray: #b0b0b0;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            height: 100vh;
            width: 260px;
            position: fixed;
            left: 0;
            top: 0;
            background-color: var(--sidebar-color);
            border-right: 1px solid rgba(138, 43, 226, 0.2);
            padding-top: 20px;
            z-index: 1000;
        }

        .sidebar-brand {
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
        }

        .nav-link {
            color: var(--text-gray);
            padding: 12px 25px;
            display: flex;
            align-items: center;
            transition: 0.3s;
            border-left: 4px solid transparent;
        }

        .nav-link i{
            margin-right: 12px;
            font-size: 1.2rem;
        }

        .nav-link:hover, .nav-link.activate {
            color: white;
            background-color: rgba(138, 43, 226, 0.1);
            border-left-color: var(--purple-primary);
        }

        /* Conteúdo Principal*/
        .main-content {
            margin-left: 260px;
            padding: 40px;
            min-height: 100vh;
        }

        .card-custom {
            background-color: var(--sidebar-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
        }

        .btn-logout {
            position: absolute;
            bottom: 20px;
            width: 100%;
            padding: 10px 25px;
            color: #ff4d4d;
            text-decoration: none;
        }
    </style>
    </head>
    <body>
        <div class="sidebar">
            <div class="sidebar-brand">
                Poup<span style="color: var(--purple-primary);">Aí</span>
            </div>
            <nav class="mt-4">
                <a href="{% url 'dashboard' %}" class="nav-link"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="{% url 'lancamentos' %}" class="nav-link"><i class="bi bi-cash-stack"></i> Lançamentos</a>
                <a href="{% url 'categorias' %}" class="nav-link"><i class="bi bi-tags"></i> Categorização</a>
                <a href="{% url 'metas' %}" class="nav-link"><i class="bi bi-trophy"></i> Gestão de Metas</a>
                <a href="{% url 'profile' %}" class="nav-link active"><i class="bi bi-person-circle"></i> Perfil</a>
            </nav>

            <a href="{% url 'logout' %}" class="btn-logout"><i class="bi bi-box-arrow-left"></i>Sair</a>
        </div>

        <div class="main-content">
            {% block content %}
            {% endblock %}
        </div>
    </body>
</html>
